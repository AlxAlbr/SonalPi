name: Empaquetage SonalPi V2 réutilisable

on:
  workflow_call:
    inputs:
      matrix:
        description: Plateformes et artefacts à produire au format JSON.
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler puis empaqueter
        run: npm run pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Uploader les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.fichiers }}
          retention-days: 7
          if-no-files-found: error
