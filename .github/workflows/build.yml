name: Build SonalPi V2 — toutes les plateformes

on:
  push:
    branches:
      - baseV2
      - test-new-design
      - max-suite-aide2
      - essai-crp-multionglet
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/_package.yml
    with:
      matrix: >-
        [{"os":"windows-latest","artifact":"sonalpi-windows","fichiers":"dist/*.exe"},{"os":"ubuntu-latest","artifact":"sonalpi-linux","fichiers":"dist/*.AppImage\ndist/*.deb"},{"os":"macos-latest","artifact":"sonalpi-macos","fichiers":"dist/*.dmg\ndist/*.zip"}]
