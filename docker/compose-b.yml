# Pile B du socle de test — Nextcloud SANS files_lock (plan-multiuser.md §12).
# Réutilise l'image nextcloud:29-apache DÉJÀ PRÉSENTE localement (zéro
# téléchargement) ; ne sert qu'à valider que la sonde de capacités dit bien
# « files_lock ABSENT » et que la variante B (PUT conditionnel) couvre tout.
#
#   npm run nc-b:up && npm run nc-b:provision    # http://localhost:8081
#
# Comptes identiques à la pile A : max/max-max-1234, olivier/olivier-olivier-5678,
# corpus partagé /MonCorpus. NE JAMAIS installer files_lock ici : cette pile EST
# le cas « capacités restreintes » du banc (invariant §15.2).

name: sonal-nc-b

services:
  db:
    image: mariadb:11
    restart: no
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    environment:
      MYSQL_ROOT_PASSWORD: sonal-root-1
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: sonal-db-1

  app:
    image: nextcloud:29-apache
    restart: no
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - db
    environment:
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin-admin-1
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: sonal-db-1
      NEXTCLOUD_TRUSTED_DOMAINS: localhost 127.0.0.1
      PHP_MEMORY_LIMIT: 512M
    volumes:
      - nc-b-data:/var/www/html/data
      - nc-b-html:/var/www/html

volumes:
  nc-b-data:
  nc-b-html:
